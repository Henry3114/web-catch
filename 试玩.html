    async function save(){readForm();VisualEngine.validate(config);templates[config.id]=structuredClone(config);await storage.set(templates);templateOptions();$('templates').value=config.id;notify('模板已保存在本机。');}
    function templateOptions(){$('templates').replaceChildren(new Option('选择已保存模板',''));for(const c of Object.values(templates))$('templates').append(new Option(c.name,c.id));}
    function exportResult(){if(!latest?.records.length)throw new Error('还没有结果，请先预览并运行。');const c=latest.config,selected=latest.records.slice(0,c.options.count);const bytes=VisualXlsx.createWorkbook(selected,c.fields,{dropEmpty:c.options.dropEmpty,errors:latest.errors});download(bytes,c.name.replace(/[\\/:*?"<>|]/g,'_')+'_'+selected.length+'条.xlsx','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');}
    async function update(){
      if(busy)return;
      try{latest=await api('state');$('progress').textContent=`${latest.records.length} / ${latest.config?.options.count || config.options.count} 条`;$('quick-progress').textContent=$('progress').textContent;$('state').textContent=({idle:'待配置',running:'运行中',paused:'已暂停',done:'已结束'})[latest.status] || latest.status;$('run-message').textContent=latest.message;$('stop').disabled=!latest.running;$('quick-stop').disabled=!latest.running;$('quick-start').disabled=latest.running;$('start').disabled=latest.running;
        if(latest.records.length)table(latest.records,latest.config.fields);
        if(startedHere && !latest.running && ['done','paused'].includes(latest.status)){
          startedHere=false;if(latest.records.length && $('auto-export').checked)exportResult();
          if(latest.status==='paused')notify(latest.message,true);
        }
      }catch(error){$('run-message').textContent=error.message;}
    }
    $('connect').onclick=safe(connect);
    $('bind').onclick=safe(async()=>{await connect();config.match.origin=new URL(context.url).origin;$('template-host').textContent='适用网站：'+config.match.origin;notify('已绑定当前网站，请重新预览或点选需要调整的字段。');});
    $('pick-list').onclick=safe(async()=>{const data=await pick('list');config.listSelector=data.selector;$('list-selector').value=data.selector;$('list-summary').textContent=`匹配 ${data.count} 条 · ${data.selector}`;notify(`已识别 ${data.count} 条记录，接下来添加字段。`);});
    $('add').onclick=()=>{readForm();config.fields.push({id:crypto.randomUUID(),name:'字段'+(config.fields.length+1),scope:'list',type:'text',selector:''});refreshFields();};
    $('mode').onchange=()=>{$('next-block').hidden=!['next','load'].includes($('mode').value);};
    $('pick-next').onclick=safe(async()=>{const result=await pick('next');$('next-selector').value=result.selector;notify('已选择翻页按钮。');});
    $('pick-click').onclick=safe(async()=>{const result=await pick('detail-click');$('click-selector').value=result.selector;notify('已选择详情点击位置。');});
    $('pick-identity').onclick=safe(async()=>{const result=await pick('identity');$('identity-selector').value=result.selector;notify('已选择详情标识：'+result.sample);});
    $('preview').onclick=safe(async()=>{const c=readForm(),result=await api('preview',c);table(result.records,c.fields);const details=c.fields.filter(f=>f.scope==='detail');$('detail-preview').hidden=!details.length;$('detail-preview').textContent='当前详情单独预览（未与每条列表关联）：\n'+details.map(f=>f.name+'：'+(result.detail[f.id] || '—')).join('\n');notify(`列表匹配 ${result.count} 条，显示前5条。`+(result.warnings.length?'\n'+result.warnings.join('\n'):''),!!result.warnings.length);});
    $('start').onclick=safe(async()=>{readForm();VisualEngine.validate(config);latest=await api('start',structuredClone(config));startedHere=true;notify('采集已开始，可暂停或导出。');await update();});
    $('stop').onclick=safe(async()=>{latest=await api('stop');startedHere=false;await update();});
    $('cancel').onclick=safe(async()=>{await api('cancelPick');notify('点选已取消。');});
    $('clear').onclick=safe(async()=>{if(latest?.records.length && !confirm('清空本次采集结果？已保存的模板不会删除。'))return;latest=await api('clear');$('preview-table').replaceChildren();await update();});
    $('excel').onclick=safe(async()=>{latest=await api('state');exportResult();});
    $('save').onclick=safe(save);
    $('new').onclick=()=>{config=DEFAULT();if(context)config.match.origin=new URL(context.url).origin;form();$('templates').value='';notify('已新建空模板；已有采集结果未删除。');};
    $('templates').onchange=()=>{if(templates[$('templates').value]){config=structuredClone(templates[$('templates').value]);form();notify('模板已加载，请先预览确认定位。');}};
    $('json').onclick=safe(()=>{readForm();VisualEngine.validate(config);download(JSON.stringify(config,null,2),config.name+'.json','application/json');});
    $('import').onclick=()=>{$('file').click();};
    $('file').onchange=safe(async()=>{const file=$('file').files[0];if(!file)return;if(file.size>200000)throw new Error('模板文件过大。');const parsed=JSON.parse(await file.text());config=VisualEngine.validate(parsed);form();notify('已导入模板，点预览检查后可保存。');$('file').value='';});
    $('delete-template').onclick=safe(async()=>{if(!templates[config.id])throw new Error('当前模板尚未保存。');if(!confirm('删除本机保存的这个模板？采集结果保留。'))return;delete templates[config.id];await storage.set(templates);templateOptions();notify('模板已删除。');});
    $('example').onclick=safe(async()=>{config=await api('example');form();notify('已填入演示模板。点“预览前5条”，再点开始。你也可以重新点选修改。');});
    for(const [quick,target]of[['quick-preview','preview'],['quick-start','start'],['quick-stop','stop'],['quick-export','excel']])$(quick).onclick=()=>$(target).click();
    form();
    const ready=(async()=>{templates=await storage.get() || {};templateOptions();await connect();await update();})().catch(error=>notify(error.message,true));
    const timer=setInterval(update,1000);
    return {ready,dispose:()=>clearInterval(timer),getConfig:readForm,loadConfig:c=>{config=structuredClone(c);form();}};
  }
  globalThis.VisualStudio={create,defaults:DEFAULT};
})();

</script><script>
"use strict";
(() => {
  const rows=Array.from({length:24},(_,i)=>({id:i+1,name:'演示岗位 '+String(i+1).padStart(2,'0'),salary:(8+i%5)+'–'+(12+i%5)+'K',company:'示例公司 '+String.fromCharCode(65+i%5),education:i%2?'本科':'大专'}));
  let page=0, mode='cards', selected=1;
  function detail(id){
    selected=id;const data=rows[id-1];
    document.querySelectorAll('.record').forEach(el=>el.classList.toggle('active',Number(el.dataset.id)===id));
    document.querySelector('#detail-title').textContent=data.name;
    setTimeout(()=>{
      document.querySelector('#detail-description').textContent=`示例编号 ${id}\n整理数据、生成报告，并跟进日常业务。\n此内容仅用于演示网页采集。`;
      document.querySelector('#detail-requirements').textContent=`${data.education}，具备沟通能力。\n示例要求 ${id}：熟悉常用办公工具。`;
    },180);
  }
  function render(){
    const container=document.querySelector('#records');container.replaceChildren();
    const list=mode==='table'?document.createElement('table'):document.createElement('div');
    if(mode==='table')list.className='demo-table';
    const body=mode==='table'?document.createElement('tbody'):list;
    if(mode==='table')list.append(body);
    for(const data of rows.slice(page*6,page*6+6)){
      const row=document.createElement(mode==='table'?'tr':'article');row.className='record';row.dataset.id=data.id;
      if(mode==='table')row.innerHTML='<td><h3 class="name"></h3><span class="company"></span><small class="education"></small></td><td><span class="salary"></span><br><button class="open-detail">查看详情</button><a class="detail-link">职位链接</a></td>';
      else row.innerHTML='<div class="row"><h3 class="name"></h3><span class="salary fixed"></span></div><span class="company"></span><small class="education"></small><small>经验不限</small><div><button class="open-detail">查看详情</button><a class="detail-link">职位链接</a></div>';
      for(const key of ['name','salary','company','education'])row.querySelector('.'+key).textContent=data[key];
      row.querySelector('a').href='https://example.com/jobs/demo-'+data.id;
      row.querySelector('a').onclick=event=>{event.preventDefault();detail(data.id);};
      row.querySelector('.open-detail').onclick=()=>detail(data.id);
      body.append(row);
    }
    container.append(list);document.querySelector('#page-indicator').textContent=`第 ${page+1}/4 页 · 共24条`;
    document.querySelector('#next').disabled=page===3;
    detail(page*6+1);
  }
  document.querySelector('#next').onclick=()=>{if(page<3){page++;render();}};
  document.querySelector('#view-cards').onclick=()=>{mode='cards';render();};
  document.querySelector('#view-table').onclick=()=>{mode='table';render();};
  document.querySelector('#reset-page').onclick=()=>{page=0;render();};
  render();
  const engine=VisualEngine.create({root:document.querySelector('#demo-page'),onUpdate:async data=>localStorage.setItem('vpc.demo.session',JSON.stringify(data))});
  const example=()=>({version:1,id:'demo-template',name:'示例职位采集',match:{origin:new URL(location.href).origin},listSelector:'#records .record',fields:[
    {id:'name',name:'岗位名称',scope:'list',type:'text',selector:'.name'},
    {id:'salary',name:'薪资',scope:'list',type:'text',selector:'.salary'},
    {id:'company',name:'公司',scope:'list',type:'text',selector:'.company'},
    {id:'url',name:'职位链接',scope:'list',type:'href',selector:'.detail-link'},
    {id:'description',name:'描述',scope:'detail',type:'text',selector:'#detail-description'},
    {id:'requirements',name:'要求',scope:'detail',type:'text',selector:'#detail-requirements'}
  ],keyFields:['url'],detail:{clickSelector:'.open-detail',identityField:'name',identitySelector:'#detail-title',identityType:'text',waitField:'description',allowSame:false},pagination:{mode:'next',selector:'#next'},options:{count:12,delay:700,timeout:8000,maxPages:4,dropEmpty:true}});
  const api=async(action,payload)=>{
    if(action==='context')return {url:location.href,title:'离线演示网页'};
    if(action==='state')return engine.snapshot();
    if(action==='example')return example();
    if(action==='pick')return engine.pick(payload);
    if(action==='cancelPick'){engine.cancelPick();return {};}
    if(action==='preview')return engine.preview(payload);
    if(action==='start')return engine.start(payload);
    if(action==='stop')return engine.stop();
    if(action==='clear')return engine.clear();
    throw new Error('未知操作');
  };
  const studio=VisualStudio.create({element:document.querySelector('#app'),api,demo:true,storage:{get:async()=>JSON.parse(localStorage.getItem('vpc.demo.templates') || '{}'),set:async data=>localStorage.setItem('vpc.demo.templates',JSON.stringify(data))}});
  globalThis.VisualDemo={engine,studio,example,render,get page(){return page;}};
})();

</script></body></html>
