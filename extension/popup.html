<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>前程无忧一键采集</title><style>body{font:14px/1.6 system-ui,"Microsoft YaHei";width:380px;margin:0;padding:18px;box-sizing:border-box;color:#173e3b}h1{font-size:19px;margin:0 0 6px}label{display:block;margin:12px 0}input{width:100%;padding:8px;box-sizing:border-box;border:1px solid #b6cfc7;border-radius:6px}button{padding:8px 12px;margin:4px 3px 0 0;border:1px solid #90b8ab;border-radius:6px;background:#fff;color:#173e3b;cursor:pointer}#start{background:#176b67;color:white}#message{white-space:pre-wrap;background:#edf6f1;padding:10px;border-radius:8px}.error{color:#a33121}small{color:#657d72}#progress{font-weight:bold;font-size:18px}details{margin-top:14px}li{margin:4px}</style><h1>前程无忧一键采集 · 1.0.0</h1><small>固定十个字段，不需要配置或点选。保持职位列表打开即可；可以关闭此小窗口。</small><label>搜索关键词<input id="keyword" placeholder="例如：数据分析师"></label><label>采集数量<input id="count" type="number" min="1" max="1000" value="20"></label><button id="start">开始／继续</button><button id="stop">暂停</button><button id="export">导出Excel</button><button id="new">新任务</button><p id="progress">尚未开始</p><p id="message">请先打开51job职位列表，填写关键词和数量。</p><details><summary>固定字段和缺项处理</summary><p>职位名称、薪资待遇、公司名称、工作地点、工作职责、任职资格、公司性质、公司规模、行业、公司介绍。</p><p>未单列或未能读取的字段留空并写明原因，同时保存原始职位描述。不会把整段要求复制为职责。登录验证、页面结构改变或职位不对应时暂停。暂停不会自动下载不完整结果。</p></details><script src="xlsx.js"></script><script src="schema.js"></script><script src="popup.js"></script></html>
