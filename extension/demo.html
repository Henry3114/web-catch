<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>网页采集工作台 · 离线演示</title><link rel="stylesheet" href="studio.css"><style id="demo-style">
body{background:#eaf0ec}.demo-layout{display:grid;grid-template-columns:minmax(560px,1fr) 430px;height:100vh}.target{padding:28px 26px;overflow:auto}.editor{background:#f4f7f6;border-left:1px solid #d3ded7;overflow:auto}.demo-top{margin-bottom:22px}.demo-top h1{font-size:26px}.demo-top p{color:#6b8278;margin:8px 0}.demo-tools{display:flex;gap:8px;align-items:center;margin-bottom:16px}.demo-tools .tag{margin-left:auto}.demo-content{display:grid;grid-template-columns:minmax(220px,.9fr) minmax(260px,1.1fr);gap:20px}.record{background:#fff;border:1px solid #d5e1d9;border-radius:10px;padding:16px;margin:0 0 10px;transition:border .2s}.record.active{border:2px solid #31917c;padding:15px}.record h3{font-size:15px;margin:0}.record .salary{color:#bd603c;font-weight:700;white-space:nowrap}.record .company{display:block;color:#668174;margin:8px 0}.record small{display:inline-block;color:#71867b;margin:0 7px 6px 0}.record a{font-size:11px;margin-left:8px;color:#537e70}.record button{font-size:12px;padding:5px 9px}.detail{background:#fff;border:1px solid #d6e1da;border-radius:12px;padding:22px;align-self:start;position:sticky;top:10px}.detail h2{font-size:19px}.detail h3{font-size:14px;margin:20px 0 8px}.detail p{white-space:pre-line;color:#536c60}.detail .tag{margin-top:10px}#next{width:100%;padding:10px}.demo-table{background:white;border-radius:8px;border-collapse:separate;border-spacing:0 5px}.demo-table .record td{min-width:0;padding:10px}#demo-note{border:1px dashed #b2c9b7;border-radius:8px;padding:12px;margin:14px 0;color:#597864;font-size:12px}@media(max-width:1000px){.demo-layout{grid-template-columns:1fr;height:auto}.target,.editor{overflow:visible}.editor{border-left:0}.demo-content{grid-template-columns:1fr 1fr}}
</style></head><body><div class="demo-layout"><main id="demo-page" class="target">
<header class="demo-top"><span class="tag">示例数据 · 不是真实招聘信息</span><h1>探索自己的采集模板</h1><p>左边是可点选的演示网页，右边是独立配置工作台。</p></header>
<div class="demo-tools"><button id="view-cards">卡片列表</button><button id="view-table">表格列表</button><button id="reset-page">回到第1页</button><span id="page-indicator" class="tag"></span></div>
<div class="demo-content"><div><div id="records"></div><button id="next">下一页 →</button></div><section id="demo-detail" class="detail"><h2 id="detail-title"></h2><span class="tag">同页详情</span><h3>描述</h3><p id="detail-description"></p><h3>要求</h3><p id="detail-requirements"></p></section></div>
<p id="demo-note">这个演示完全离线。你可以先点右侧“填入演示模板”体验，也可以从“点选一整条记录”开始自由配置。运行中请不要手动换页或切换展示方式。</p></main><aside class="editor"><main id="app"></main></aside></div>
<script src="locator.js"></script><script src="detect.js"></script><script src="engine.js"></script><script src="xlsx.js"></script><script src="studio-ui.js"></script><script src="demo.js"></script></body></html>
